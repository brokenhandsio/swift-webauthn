name: Main

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit tests
    uses: swiftlang/github-workflows/.github/workflows/swift_package_test.yml@06cbfd087b9b8adb0ffbdae7f951f8b4f79d8473
    with:
      macos_xcode_versions: '["swift_6.4"]'
      linux_swift_versions: '["6.4","nightly-main","nightly-6.4.x"]'
      windows_swift_versions: '["6.4","nightly-main","nightly-6.4.x"]'
      swift_flags: "-Xswiftc -warnings-as-errors --explicit-target-dependency-import-check error -Xswiftc -require-explicit-sendable"
      swift_nightly_flags: "--explicit-target-dependency-import-check error -Xswiftc -require-explicit-sendable"
